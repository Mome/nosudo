[project]
name = "unsudo"
version = "0.1.0"
description = "Time-boxed, reboot/crash-safe self-control tool that revokes a user's sudo for a bounded period."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
unsudo = "unsudo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unsudo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
