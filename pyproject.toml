[project]
name = "nosudo"
version = "0.1.0"
description = "Time-boxed, reboot/crash-safe self-control tool that revokes a user's sudo for a bounded period."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
nosudo = "nosudo.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nosudo"]

[tool.hatch.build.targets.wheel.shared-scripts]
"scripts/curfew" = "curfew"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
